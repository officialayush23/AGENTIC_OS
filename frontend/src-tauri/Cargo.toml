[package]
name = "agentic-os"
version = "0.1.0"
description = "Agentic OS desktop shell: hosts the UI and supervises the local Python kernel"
edition = "2021"
rust-version = "1.77"

[lib]
name = "agentic_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
